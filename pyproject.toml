[project]
name = "alpamayo-workspace"
version = "0.0.0"
description = "Single venv for running Alpamayo R1 and Alpamayo 1.5 inference"
requires-python = "==3.12.*"
dependencies = [
  "alpamayo_r1",
  "alpamayo1_5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["alpamayo", "alpamayo1.5"]

[tool.uv.sources]
alpamayo_r1 = { workspace = true }
alpamayo1_5 = { workspace = true }
cosmos-rl = { git = "https://github.com/nvidia-cosmos/cosmos-rl.git", rev = "747d1bd" }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.8cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }
