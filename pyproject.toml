[project]
name = "alpamayo-workspace"
version = "0.0.0"
description = "Single venv for running Alpamayo R1 and Alpamayo 1.5 inference"
requires-python = "==3.12.*"
dependencies = [
  "alpamayo_r1",
  "alpamayo1_5",
  "carla==0.9.16",
  "pygame",
  "py-trees==0.8.3",
  "tabulate>=0.10.0",
  "shapely>=2.1.2",
  "dictor>=0.1.12",
  "pexpect>=4.9.0",
  "transforms3d>=0.4.2",
  "xmlschema>=4.3.1",
  "simple-watchdog-timer>=0.1.1",
  "ephem>=4.2.1",
  "networkx>=3.6.1",
  "psutil>=7.2.2",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["alpamayo", "alpamayo1.5"]

[tool.uv.sources]
alpamayo_r1 = { workspace = true }
alpamayo1_5 = { workspace = true }
cosmos-rl = { git = "https://github.com/nvidia-cosmos/cosmos-rl.git", rev = "747d1bd" }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.8cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }
carla = { path = "../../CARLA_0.9.16/PythonAPI/carla/dist/carla-0.9.16-cp312-cp312-manylinux_2_31_x86_64.whl" }

[tool.ruff]
line-length = 100
src = ["team_code"]

[tool.ruff.lint]
select = ["I"]
extend-ignore = ["ANN", "D"]
ignore = [
    "ARG002",
    "COM812",
    "E501",
    "EM101",
    "PERF102",
    "PTH119",
    "PLR0913",
    "RET504",
    "RSE102",
    "SIM102", "SIM118",
    "UP031",

    "B028",
    "BLE001",
    "D100", "D103", "D104", "D105", "D107", "D205", "D212", "D213",
    "DTZ005",
    "EM102",
    "ERA001",
    "FA100", "FA102",
    "FBT001", "FBT002",
    "G004",
    "INP001",
    "N806", "N812",
    "NPY002",
    "PLR2004",
    "PLW2901",
    "RET505",
    "RUF003",
    "S101", "S602",
    "T201",
    "TRY003",
]
